<h2 mat-dialog-title>Supprimer le client</h2>
<mat-dialog-content>
  Voulez-vous vraiment supprimer <u>{{ data.customer.fullname }}</u> de la liste des clients ?
</mat-dialog-content>
<mat-dialog-actions>
  <button matButton="text" (click)="dialogIgnored()">Non</button>
  <button matButton="filled" [mat-dialog-close]="true" cdkFocusInitial>Oui</button>
</mat-dialog-actions>
