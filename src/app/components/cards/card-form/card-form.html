<h2>Ajouter une carte</h2>

<form [formGroup]="cardForm">
  <mat-form-field appearance="outline">
    <mat-label>N° de la Carte</mat-label>
    <input
      matInput
      type="text"
      (ngModelChange)="formatCardNumber($event)"
      [ngModel]="cardNumberModel"
      maxlength="19"
      formControlName="cardNumber"
    /> </mat-form-field
  ><br />
  <mat-form-field appearance="outline">
    <mat-label>Type de Carte</mat-label>
    <mat-select formControlName="cardType">
      @for (cardType of cardTypes; track cardType) {
        <mat-option [value]="cardType.value">{{ cardType.label }}</mat-option>
      }
    </mat-select>
  </mat-form-field>
  <mat-form-field appearance="outline">
    <mat-label>Banque</mat-label>
    <mat-select formControlName="bankType">
      @for (bankType of bankTypes; track bankType) {
        <mat-option [value]="bankType.value">{{ bankType.label }}</mat-option>
      }
    </mat-select> </mat-form-field
  ><br />
  <mat-form-field appearance="outline">
    <mat-label>Code PIN</mat-label>
    <input matInput type="text" formControlName="cardPin" /> </mat-form-field
  ><br />
  <button type="submit" matButton="filled" [disabled]="cardForm.invalid" (click)="addCard()">
    Ajouter
  </button>
  <button type="reset" matButton (click)="returnToLanding()">Annuler</button>
</form>
